spring:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        default_schema: app
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-init.sql
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-client-id
            client-secret: test-client-secret

app:
  frontend-url: http://localhost:3000
